name: Rollback GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag or branch from this repository to redeploy
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK to confirm the production replacement
        required: true
        type: string

permissions: {}

concurrency:
  group: portfolio-pages-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate rollback
    if: inputs.confirmation == 'ROLLBACK'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      selected_sha: ${{ steps.revision.outputs.selected_sha }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate selected revision
        id: revision
        shell: bash
        run: |
          selected_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$selected_sha" origin/main; then
            echo "::error::The selected revision must belong to the history of this repository's main branch."
            exit 1
          fi
          echo "selected_sha=$selected_sha" >> "$GITHUB_OUTPUT"
          echo "Rebuilding $selected_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build selected Astro revision
        env:
          PUBLIC_BUILD_SHA: ${{ steps.revision.outputs.selected_sha }}
        run: npm run build

      - name: Test compiled site
        run: node --test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile browsers
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload tested rollback artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy rollback
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy selected revision
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Verify rollback
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current production verifier
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Verify published revision
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ needs.validate.outputs.selected_sha }}
        run: node scripts/verify-production.mjs
