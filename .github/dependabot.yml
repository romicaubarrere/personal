version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Montevideo
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      production-compatible:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      development-compatible:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: America/Montevideo
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
    groups:
      actions-compatible:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
