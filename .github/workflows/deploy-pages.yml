name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and upload Astro site
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify published Astro site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          page="$(mktemp)"
          curl --fail --location --retry 6 --retry-delay 10 --retry-all-errors \
            --output "$page" "$PAGE_URL"
          grep --fixed-strings '<html lang="es">' "$page"
          grep --fixed-strings '<link rel="canonical" href="https://romicaubarrere.github.io/personal/">' "$page"
          grep --fixed-strings '/personal/_astro/' "$page"
