name: Rollback GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag or branch from this repository to redeploy
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK to confirm the production replacement
        required: true
        type: string

permissions: {}

concurrency:
  group: portfolio-pages-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate rollback
    if: inputs.confirmation == 'ROLLBACK'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      selected_sha: ${{ steps.revision.outputs.selected_sha }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate selected revision
        id: revision
        shell: bash
        run: |
          selected_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$selected_sha" origin/main; then
            echo "::error::The selected revision must belong to the history of this repository's main branch."
            exit 1
          fi
          echo "selected_sha=$selected_sha" >> "$GITHUB_OUTPUT"
          echo "Rebuilding $selected_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Activate pinned npm
        run: npm install --global --ignore-scripts npm@11.9.0 && test "$(npm --version)" = "11.9.0"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build selected Astro revision
        env:
          PUBLIC_BUILD_SHA: ${{ steps.revision.outputs.selected_sha }}
        run: npm run build

      - name: Test compiled site
        run: node --test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile browsers
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollback-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload tested rollback artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy rollback
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy selected revision
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  verify:
    name: Verify rollback
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current production verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Verify published revision
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ needs.validate.outputs.selected_sha }}
        run: node scripts/verify-production.mjs
