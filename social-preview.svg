<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Romina Caubarrere, Project Manager de software</title>
  <desc id="description">Tarjeta verde y crema con la identidad visual del portfolio El estudio de Romi.</desc>
