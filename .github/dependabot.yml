version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Montevideo
    open-pull-requests-limit: 3
    target-branch: main
    groups:
      compatible-npm-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Montevideo
    open-pull-requests-limit: 2
    target-branch: main
    groups:
      compatible-actions-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
